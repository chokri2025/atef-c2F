<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#003D82"/>
      <stop offset="100%" stop-color="#0077D9"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#F8B400"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8"/>

  <!-- Energy / Power Symbol - Stylized Lightning Bolt -->
  <path d="M295 48L160 272h96l-39 192 165-240h-106l49-176z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)"/>

  <!-- Brand Monogram -->
  <text x="256" y="475" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif" 
        font-size="82" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#FFFFFF">C2F</text>
</svg>
